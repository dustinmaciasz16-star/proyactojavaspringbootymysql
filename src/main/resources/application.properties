#Conexion a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/proyectos_db
spring.datasource.username=root
spring.datasource.password=dustin
#Driver
spring.datasource.drive-class-name=com.mysql.cj.jdbc.Driver
#Hibernate crea y actualiza tablas automaticamente
spring.jpa.hibernate.ddl-auto=update
#Mostrar el SQL en consola
spring.jpa.show-sql=true
#Formatear SQL
spring.jpa.properties.hibernate.format_sql=true
#logs de spring
looging.level.org.springframework=INFO
#logs de hibernate SQL
looging.level.org.hibernate.SQL=DEBUG
#Mostrar parametros SQL
looging.level.org.hibernate.orm.jdbc.bind=TRACE
